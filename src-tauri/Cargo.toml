[package]
name = "infiniity-dj"
version = "0.2.8"
description = "Infiniity DJ - Mezclador de musica liviano para eventos"
authors = ["Infiniity Eventos"]
edition = "2021"
rust-version = "1.77"

# El nombre de la libreria que usa el binario de escritorio.
[lib]
name = "infiniity_dj_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Lectura/organizacion de la biblioteca musical
walkdir = "2"

# Analisis de BPM: decodificacion de audio 100% en Rust (sin dependencias del sistema)
symphonia = { version = "0.5", default-features = false, features = ["mp3", "wav", "pcm"] }

# Controladora DDJ-200 por MIDI nativo (no depende de Web MIDI)
midir = "0.10"

# Actualizacion automatica: revisa GitHub Releases al abrir y avisa si hay
# version nueva. `process` es para reiniciar la app despues de actualizar.
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

# Descarga e instalacion del descargador SIN depender de curl ni python3.
#
# POR QUE: usando los del sistema, la instalacion fallaba en equipos ajenos y
# de formas distintas segun la maquina (curl error 77 por el almacen de
# certificados roto, python3 roto por las variables del AppImage...). Con esto
# el programa se basta solo.
#
# "webpki-roots" es la clave: lleva sus PROPIOS certificados raiz dentro del
# programa, asi que no importa si el almacen del equipo esta roto.
reqwest = { version = "0.12", default-features = false, features = [
    "blocking",
    "rustls-tls-webpki-roots",
] }
# Descomprimir el .zip de Deno sin llamar a python3.
zip = { version = "2", default-features = false, features = ["deflate"] }

[features]
# por defecto vacio

# Optimizacion para equipos de gama baja: binario mas pequeno y rapido en release.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
